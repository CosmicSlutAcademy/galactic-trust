[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# test/CircomVerifier.t.sol reads the Groth16 fixtures with vm.readFile. Foundry resolves
# readFile against the project root, not the test directory, so the path is relative to
# here. Without this, setUp fails with "the path ... is not allowed to be accessed".
fs_permissions = [{ access = "read", path = "./test/fixtures"}]

# The optimizer is off by default, which left the runtime bytecode at ~38 KB against the
# 24,576 B EIP-170 limit, so the contract could not have been deployed at all. Verified with
# `forge build --sizes`.
optimizer = true

# Measured 2026-10-02, re-measured 2026-10-13 on the post-audit-sweep build (23,234 B at the
# chosen setting) — the 2026-10-02 table had gone stale after the fund-loss fixes added ~671 B.
# The earlier note here claimed high turn counts were pinned "because higher values traded a few
# hundred bytes for a large gas regression" — that regression does not exist. Lower
# `optimizer_runs` shrinks the bytecode and costs a little gas, monotonically. Gas is a single
# deterministic settlement benchmark (`test_UpheldDisputeSlashesStake`) so it is reproducible,
# not an aggregate of unknown composition:
#
#   runs      runtime B   EIP-170 margin   benchmark gas
#   1           23,187          1,389          625,784
#   20          23,234          1,342          618,250   <-- chosen
#   50          23,372          1,204          618,040
#   100         23,465          1,111          617,335
#   200         23,829            747          616,561
#   999999      30,800         -6,224          615,140   UNDEPLOYABLE
#
# 20 takes ~93% of the available size win (200 -> 20 recovers 595 of the 642 B that 200 -> 1
# does) for a ~0.3% gas premium over 200. Going 20 -> 1 buys 47 B more for another ~1.2% gas,
# which is a bad trade. EIP-170 is a hard deployability cliff and gas is a soft recurring cost,
# so when the two conflict the cliff wins.
optimizer_runs = 20

# Re-measured 2026-10-02 on the curator-bond build: via_ir produced 23,382 B runtime, 257 B
# *larger* than the legacy pipeline's 23,125 B, and took 3m36s to compile instead of seconds.
# Still off. Re-measure if the contract changes substantially again.
via_ir = false

# Invariant sweep depth. Foundry's defaults are 256 runs x 500 depth = 128,000 calls per
# property; across the 7 properties in test/Invariant.t.sol that measured 205 s, far too slow to
# run on every edit. An invariant suite nobody runs is the same as no suite, so the default is
# trimmed here and `profile.deep` is what CI and any pre-ship run should use.
#
# These must live in an `[invariant]` table. Written as top-level `invariant_runs` /
# `invariant_depth` they are accepted silently and ignored — verify with `forge config`.
[invariant]
runs = 32
depth = 250

# Full-depth sweep. Run with: FOUNDRY_PROFILE=deep forge test
[profile.deep]
[profile.deep.fuzz]
runs = 2000

[profile.deep.invariant]
runs = 256
depth = 500

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options